[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "depths-roguelike"
version = "2.2.0"
description = "A terminal roguelike with pixel rendering (Kitty graphics protocol / sixel) and a curses fallback"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pillow"]

[project.scripts]
depths = "depths.app:run"

[tool.setuptools]
packages = ["depths"]
