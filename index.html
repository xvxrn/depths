<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>depths — pixel roguelike</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0e14; color: #c9d1d9; font-family: 'Courier New', monospace; display: flex; flex-direction: column; align-items: center; padding: 12px; }
  h1 { color: #58a6ff; font-size: 20px; margin-bottom: 6px; letter-spacing: 2px; }
  #wrap { display: flex; gap: 12px; }
  canvas { border: 2px solid #30363d; image-rendering: pixelated; image-rendering: crisp-edges; background: #0d1117; }
  #side { width: 300px; display: flex; flex-direction: column; gap: 8px; }
  .panel { background: #161b22; border: 1px solid #30363d; padding: 8px; border-radius: 4px; font-size: 13px; line-height: 1.5; }
  .panel h3 { color: #58a6ff; font-size: 12px; text-transform: uppercase; margin-bottom: 4px; }
  #log { height: 160px; overflow-y: auto; font-size: 12px; }
  #log div { padding: 1px 0; border-bottom: 1px solid #21262d; }
  #stats { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 8px; }
  #stats span { color: #8b949e; } #stats b { color: #f0f6fc; }
  #inv { max-height: 200px; overflow-y: auto; }
  #inv .item { cursor: pointer; padding: 2px 4px; border-radius: 2px; }
  #inv .item:hover { background: #21262d; }
  #inv .sel { background: #1f6feb; }
  #overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 10; }
  #overlay .box { background: #161b22; border: 2px solid #58a6ff; padding: 24px; text-align: center; border-radius: 8px; max-width: 420px; }
  #overlay h2 { color: #f85149; margin-bottom: 12px; }
  #overlay.victory h2 { color: #3fb950; }
  button { background: #238636; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-family: inherit; margin: 4px; }
  button:hover { background: #2ea043; }
  .help { font-size: 11px; color: #8b949e; }
  kbd { background: #21262d; padding: 1px 5px; border-radius: 3px; border: 1px solid #30363d; }
</style>
</head>
<body>
<h1>DEPTH S</h1>
<div id="wrap">
  <canvas id="c" width="960" height="600"></canvas>
  <div id="side">
    <div class="panel">
      <h3>Stats</h3>
      <div id="stats"></div>
    </div>
    <div class="panel">
      <h3>Log</h3>
      <div id="log"></div>
    </div>
    <div class="panel">
      <h3>Inventory (I)</h3>
      <div id="inv"></div>
      <div class="help">Enter=equip/use &nbsp; Del=drop</div>
    </div>
    <div class="panel help">
      Arrows/WASD move &nbsp; <kbd>></kbd> descend &nbsp; <kbd>P</kbd> potion &nbsp; <kbd>F</kbd> eat &nbsp; <kbd>R</kbd> scroll &nbsp; <kbd>X</kbd> search &nbsp; <kbd>C</kbd> stats &nbsp; <kbd>S</kbd> save
    </div>
  </div>
</div>

<div id="overlay">
  <div class="box">
    <h2 id="ovTitle">GAME OVER</h2>
    <p id="ovText"></p>
    <button onclick="restart()">Play again</button>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const T = 24; // tile size in pixels
const MW = Math.floor(canvas.width / T);   // 40
const MH = Math.floor(canvas.height / T);  // 25

const COLORS = {
  wall: '#1f2937', wallHi: '#374151',
  floor: '#0f1f17', floorHi: '#1a2e22',
  door: '#7c5a2a', stairs: '#f59e0b', secret: '#1f2937',
  player: '#3fb950', playerEye: '#0d1117',
  goblin: '#22c55e', orc: '#16a34a', troll: '#15803d', dragon: '#dc2626',
  skeleton: '#e5e7eb', bat: '#a78bfa', wraith: '#c084fc',
  archer: '#f97316', necromancer: '#a855f7', mimic: '#fbbf24',
  rat: '#92400e', vampire: '#be123c', golem: '#6b7280',
  potion: '#ec4899', food: '#84cc16', weapon: '#f59e0b', armor: '#3b82f6',
  gold: '#facc15', scroll: '#e879f9', ring: '#f472b6', wand: '#c4b5fd',
  key: '#fde047', trap: '#ef4444', fog: 'rgba(0,0,0,0.55)',
  explored: 'rgba(0,0,0,0.35)',
};

let game = null;

function biome(f){ if(f<=3) return 'Dungeon'; if(f<=6) return 'Caves'; if(f<=9) return 'Crypt'; return 'Abyss'; }

const ENEMY_STATS = {
  g:[6,2,3], o:[12,4,6], T:[25,7,12], D:[60,15,40],
  s:[8,3,4], b:[4,1,2], W:[18,6,10], a:[10,3,5],
  n:[14,2,8], m:[15,4,6], r:[3,1,1], V:[22,5,12], G:[40,6,15],
};

function makeDungeon(floor){
  const grid = Array.from({length:MH},()=>Array(MW).fill(0)); // 0 wall
  const rooms = [];
  let attempts=0;
  while(rooms.length < 8 && attempts < 300){
    attempts++;
    const w = 4+Math.floor(Math.random()*7);
    const h = 3+Math.floor(Math.random()*5);
    const x = 1+Math.floor(Math.random()*(MW-w-2));
    const y = 1+Math.floor(Math.random()*(MH-h-2));
    let ok=true;
    for(const [rx,ry,rw,rh] of rooms){
      if(x<rx+rw+2 && x+w+2>rx && y<ry+rh+2 && y+h+2>ry){ ok=false; break; }
    }
    if(ok){
      rooms.push([x,y,w,h]);
      for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++) grid[yy][xx]=1;
    }
  }
  for(let i=1;i<rooms.length;i++){
    const [x1,y1,w1,h1]=rooms[i-1];
    const [x2,y2,w2,h2]=rooms[i];
    const cx1=x1+w1>>1, cy1=y1+h1>>1;
    const cx2=x2+w2>>1, cy2=y2+h2>>1;
    if(Math.random()<0.5){
      for(let xx=Math.min(cx1,cx2);xx<=Math.max(cx1,cx2);xx++) grid[cy1][xx]=1;
      for(let yy=Math.min(cy1,cy2);yy<=Math.max(cy1,cy2);yy++) grid[yy][cx2]=1;
    } else {
      for(let yy=Math.min(cy1,cy2);yy<=Math.max(cy1,cy2);yy++) grid[yy][cx1]=1;
      for(let xx=Math.min(cx1,cx2);xx<=Math.max(cx1,cx2);xx++) grid[cy2][xx]=1;
    }
  }
  // secret doors
  for(let y=1;y<MH-1;y++) for(let x=1;x<MW-1;x++){
    if(grid[y][x]===0){
      if((grid[y-1][x]===1 && grid[y+1][x]===1)||(grid[y][x-1]===1 && grid[y][x+1]===1)){
        if(Math.random()<0.04) grid[y][x]=4; // secret
      }
    }
  }
  return {grid,rooms};
}

function placeEntities(grid, floor, px, py){
  const entities=[], items=[], traps=[];
  const cands=[];
  for(let y=1;y<MH-1;y++) for(let x=1;x<MW-1;x++){
    if(grid[y][x]===1 && Math.abs(x-px)+Math.abs(y-py)>6) cands.push([x,y]);
  }
  // shuffle
  for(let i=cands.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cands[i],cands[j]]=[cands[j],cands[i]]; }
  let idx=0;
  const pool=['g','g','g','r','r','o','s','b'];
  if(floor>=2) pool.push('o','o','a','s','W');
  if(floor>=3) pool.push('T','n','V');
  if(floor>=4) pool.push('T','m','G');
  if(floor>=5) pool.push('D','n','m');
  if(floor%5===0) pool.splice(0,pool.length,'D','T','T','W','W','n','m');
  const nE=4+floor*2+Math.floor(Math.random()*4);
  for(let i=0;i<nE && idx<cands.length;i++){
    const [x,y]=cands[idx++];
    const ch=pool[Math.floor(Math.random()*pool.length)];
    const [hp,atk,xp]=ENEMY_STATS[ch];
    const shp=Math.floor(hp*(1+0.12*(floor-1)));
    const satk=Math.floor(atk*(1+0.08*(floor-1)));
    const e={ch,x,y,hp:shp,maxhp:shp,atk:satk,name:ch,xp};
    if(Math.random()<0.15 && floor>=2){
      // mimic instead? push as mimic entity with disguise
    }
    entities.push(e);
  }
  // mimics: convert some enemies? simpler: add mimic entities disguised
  const nI=3+Math.floor(Math.random()*3)+Math.floor(floor/2);
  for(let i=0;i<nI && idx<cands.length;i++){
    const [x,y]=cands[idx++];
    if(Math.random()<0.15 && floor>=2){
      const hp=ENEMY_STATS.m[0];
      entities.push({ch:'m',x,y,hp,maxhp:hp,atk:ENEMY_STATS.m[1],name:'m',xp:ENEMY_STATS.m[2],disguise:['!','/',']','$','?','%'][Math.floor(Math.random()*6)]});
    } else {
      const ch=['!','!','%','%','/',']','$','?','?','=','/'][Math.floor(Math.random()*11)];
      items.push({ch,x,y});
    }
  }
  const nT=1+Math.floor(Math.random()*3)+Math.floor(floor/3);
  for(let i=0;i<nT && idx<cands.length;i++){
    const [x,y]=cands[idx++];
    traps.push({ch:['^','^','~','@','!'][Math.floor(Math.random()*5)],x,y,triggered:false});
  }
  // stairs
  const occ=new Set(entities.map(e=>e.x+','+e.y).concat(items.map(it=>it.x+','+it.y)));
  const far=cands.filter(c=>Math.abs(c[0]-px)+Math.abs(c[1]-py)>15 && !occ.has(c[0]+','+c[1]));
  if(far.length){ const [sx,sy]=far[Math.floor(Math.random()*far.length)]; grid[sy][sx]=3; }
  // keys
  if(Math.random()<0.35 && idx<cands.length){ const [x,y]=cands[idx++]; items.push({ch:'k',x,y}); }
  return {entities,items,traps};
}

class Game {
  constructor(){
    this.floor=1;
    this.player={x:0,y:0,hp:24,maxhp:24,atk:4,def:1,xp:0,level:1,gold:0,potions:1,scrolls:0,food:3,hunger:0,
      weapon:null,armor:null,ring:null,inventory:[],keys:0};
    this.messages=[];
    this.explored=new Set();
    this.visible=new Set();
    this.victory=false; this.gameOver=false;
    this.invOpen=false; this.invCursor=0;
    this.newFloor();
  }
  newFloor(){
    const {grid,rooms}=makeDungeon(this.floor);
    this.grid=grid;
    const [rx,ry,rw,rh]=rooms[0];
    this.player.x=rx+(rw>>1); this.player.y=ry+(rh>>1);
    const pe=placeEntities(grid,this.floor,this.player.x,this.player.y);
    this.entities=pe.entities; this.items=pe.items; this.traps=pe.traps;
    this.log(`--- Floor ${this.floor}: ${biome(this.floor)} ---`);
    this.computeFov();
  }
  computeFov(){
    this.visible=new Set();
    const {x:px,y:py}=this.player; const R=8;
    for(let dy=-R;dy<=R;dy++) for(let dx=-R;dx<=R;dx++){
      if(dx*dx+dy*dy>R*R) continue;
      const x=px+dx,y=py+dy;
      if(x<0||x>=MW||y<0||y>=MH) continue;
      if(this.los(px,py,x,y)){ this.visible.add(x+','+y); this.explored.add(x+','+y); }
    }
  }
  los(x0,y0,x1,y1){
    let dx=Math.abs(x1-x0), dy=Math.abs(y1-y0);
    const sx=x0<x1?1:-1, sy=y0<y1?1:-1;
    let err=dx-dy, x=x0, y=y0;
    while(true){
      if(x===x1 && y===y1) return true;
      if((x!==x0||y!==y0) && (this.grid[y][x]===0 || this.grid[y][x]===4)) return false;
      const e2=2*err;
      if(e2>-dy){ err-=dy; x+=sx; }
      if(e2<dx){ err+=dx; y+=sy; }
    }
  }
  log(t){ this.messages.push(t); if(this.messages.length>8) this.messages=this.messages.slice(-8); if(window.game) renderLog(); }
  totalAtk(){ let b=this.player.atk; if(this.player.weapon) b+=this.player.weapon.atk; if(this.player.ring) b+=this.player.ring.atk; return b; }
  totalDef(){ let b=this.player.def; if(this.player.armor) b+=this.player.armor.def; if(this.player.ring) b+=this.player.ring.def; return b; }
  move(dx,dy){
    if(this.invOpen) return;
    const nx=this.player.x+dx, ny=this.player.y+dy;
    if(nx<0||nx>=MW||ny<0||ny>=MH) return;
    const cell=this.grid[ny][nx];
    if(cell===0){ this.log('A wall blocks your path.'); return; }
    if(cell===4){ this.grid[ny][nx]=2; this.log('You found a secret door!'); }
    // enemy?
    const e=this.entities.find(en=>en.hp>0 && en.x===nx && en.y===ny);
    if(e){ this.attack(e); this.endTurn(); return; }
    // item?
    const it=this.items.find(i=>i.x===nx && i.y===ny);
    if(it){ this.pickup(it); this.items=this.items.filter(i=>i!==it); }
    // trap?
    const t=this.traps.find(tr=>tr.x===nx && tr.y===ny && !tr.triggered);
    if(t) this.triggerTrap(t);
    // stairs?
    if(this.grid[ny][nx]===3){
      if(this.floor>=15){ this.victory=true; this.gameOver=true; this.log('You escaped the depths!'); return; }
      this.floor++; this.log(`You descend to floor ${this.floor}.`); this.newFloor(); this.endTurn(); return;
    }
    this.player.x=nx; this.player.y=ny;
    this.endTurn();
  }
  endTurn(){
    this.player.hunger++;
    if(this.player.hunger>=40 && this.player.hunger%10===0){ this.player.hp=Math.max(1,this.player.hp-1); this.log('You are starving.'); }
    this.enemyTurn();
    this.revealSecrets();
    this.computeFov();
  }
  revealSecrets(){
    const {x:px,y:py}=this.player;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      const x=px+dx,y=py+dy;
      if(x>=0&&x<MW&&y>=0&&y<MH && this.grid[y][x]===4 && Math.random()<0.25){ this.grid[y][x]=2; this.log('You notice a secret door.'); }
    }
  }
  attack(e){
    const patk=this.totalAtk();
    let dmg=Math.max(1, patk-1+Math.floor(Math.random()*4)-1);
    if(Math.random()<0.1){ dmg=Math.floor(dmg*1.8); this.log('Critical hit!'); }
    e.hp-=dmg; this.log(`You hit ${e.ch} for ${dmg}.`);
    if(e.hp<=0){ e.hp=0; this.log(`${e.ch} dies.`); this.player.xp+=e.xp||3;
      if(Math.random()<0.4){ const amt=1+Math.floor(Math.random()*6)+this.floor; this.player.gold+=amt; this.log(`It drops ${amt} gold.`); }
      this.checkLevel();
    }
  }
  enemyTurn(){
    for(const e of this.entities){
      if(e.hp<=0) continue;
      if(Math.abs(e.x-this.player.x)+Math.abs(e.y-this.player.y)===1){
        const dmg=Math.max(1, e.atk-this.totalDef()+Math.floor(Math.random()*3)-1);
        if(e.ch==='V') e.hp=Math.min(e.maxhp, e.hp+Math.floor(dmg/2));
        this.player.hp-=dmg; this.log(`${e.ch} hits you for ${dmg}.`);
        if(this.player.hp<=0){ this.player.hp=0; this.gameOver=true; }
        continue;
      }
      if((e.ch==='a') && this.visible.has(e.x+','+e.y)){
        const dist=Math.abs(e.x-this.player.x)+Math.abs(e.y-this.player.y);
        if(dist>=2 && dist<=6 && this.los(e.x,e.y,this.player.x,this.player.y) && Math.random()<0.6){
          const dmg=Math.max(1, e.atk-this.totalDef()+Math.floor(Math.random()*2));
          this.player.hp-=dmg; this.log(`${e.ch} shoots you for ${dmg}.`);
          if(this.player.hp<=0){ this.player.hp=0; this.gameOver=true; }
          continue;
        }
      }
      if(e.ch==='n' && this.visible.has(e.x+','+e.y) && Math.random()<0.25){
        for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
          const nx=e.x+dx,ny=e.y+dy;
          if(nx>=0&&nx<MW&&ny>=0&&ny<MH && this.grid[ny][nx]===1 && !this.entities.some(o=>o.hp>0&&o.x===nx&&o.y===ny)){
            this.entities.push({ch:'s',x:nx,y:ny,hp:8,maxhp:8,atk:3,name:'s',xp:4}); this.log('Necromancer summons a skeleton.'); break;
          }
        }
      }
      if(this.visible.has(e.x+','+e.y) || Math.abs(e.x-this.player.x)+Math.abs(e.y-this.player.y)<=7){
        let dx=0,dy=0;
        if(e.x<this.player.x) dx=1; else if(e.x>this.player.x) dx=-1;
        if(e.y<this.player.y) dy=1; else if(e.y>this.player.y) dy=-1;
        if(e.ch==='b' && Math.random()<0.4){ const d=[[1,0],[-1,0],[0,1],[0,-1],[0,0]][Math.floor(Math.random()*5)]; dx=d[0]; dy=d[1]; }
        const nx=e.x+dx, ny=e.y+dy;
        if(nx>=0&&nx<MW&&ny>=0&&ny<MH && [1,2,3].includes(this.grid[ny][nx]) && !this.entities.some(o=>o!==e && o.hp>0 && o.x===nx && o.y===ny) && !(nx===this.player.x&&ny===this.player.y)){
          e.x=nx; e.y=ny;
        }
      }
    }
  }
  triggerTrap(t){
    t.triggered=true;
    if(t.ch==='^'){ const dmg=3+Math.floor(Math.random()*6)+Math.floor(this.floor/2); this.player.hp-=dmg; this.log(`Spike trap hits you for ${dmg}!`); }
    else if(t.ch==='~'){ this.player.hp=Math.max(1,this.player.hp-4); this.player.hunger+=20; this.log('Poison! HP -4, hunger +20.'); }
    else if(t.ch==='@'){ const tiles=[]; for(let y=0;y<MH;y++) for(let x=0;x<MW;x++) if(this.grid[y][x]===1 && !(x===this.player.x&&y===this.player.y)) tiles.push([x,y]); if(tiles.length){ const [x,y]=tiles[Math.floor(Math.random()*tiles.length)]; this.player.x=x; this.player.y=y; this.log('Teleport trap!'); } }
    else if(t.ch==='!'){ for(let i=0;i<3;i++) for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=this.player.x+dx,ny=this.player.y+dy; if(nx>=0&&nx<MW&&ny>=0&&ny<MH && this.grid[ny][nx]===1 && !this.entities.some(o=>o.hp>0&&o.x===nx&&o.y===ny)){ this.entities.push({ch:'g',x:nx,y:ny,hp:6,maxhp:6,atk:2,name:'g',xp:3}); break; } } this.log('Alarm! Enemies appear.'); }
    if(this.player.hp<=0){ this.player.hp=0; this.gameOver=true; }
  }
  pickup(it){
    const ch=it.ch;
    if(ch==='!'){ this.player.potions++; this.log('You pick up a health potion.'); }
    else if(ch==='%'){ this.player.food++; this.log('You pick up food.'); }
    else if(ch==='/'){ this.player.inventory.push({ch:'/',name:`weapon (+${2+Math.floor(this.floor/3)} ATK)`,item:{type:'weapon',atk:2+Math.floor(this.floor/3)},kind:'equip'}); this.log('You find a weapon. (I to equip)'); }
    else if(ch===']'){ this.player.inventory.push({ch:']',name:`armor (+${1+Math.floor(this.floor/4)} DEF)`,item:{type:'armor',def:1+Math.floor(this.floor/4),hp:2+Math.floor(this.floor/2)},kind:'equip'}); this.log('You find armor.'); }
    else if(ch==='$'){ const amt=5+Math.floor(Math.random()*16)+this.floor*2; this.player.gold+=amt; this.log(`You find ${amt} gold.`); }
    else if(ch==='?'){ this.player.scrolls++; this.log('You find a scroll.'); }
    else if(ch==='='){ this.player.inventory.push({ch:'=',name:'ring (+1 ATK/DEF)',item:{type:'ring',atk:1,def:1},kind:'equip'}); this.log('You find a ring.'); }
    else if(ch==='/'){ /* wand handled below */ }
    else if(ch==='/'){}
    else if(ch==='w'){ this.player.inventory.push({ch:'w',name:'wand (fireball)',item:{type:'wand'},kind:'wand'}); this.log('You find a wand.'); }
    else if(ch==='k'){ this.player.keys++; this.log('You pick up a key.'); }
  }
  // wands added as separate item char 'w'? We'll reuse '/'? Actually item ch '/' is weapon. Let's add wand as 'w' char.
  // (handled in placeEntities? we used '/' for weapon; wand not placed currently. Add wand placement:)
  usePotion(){
    if(this.player.potions<=0){ this.log('No potions.'); return; }
    this.player.potions--;
    const heal=10+Math.floor(Math.random()*7)+this.player.level;
    this.player.hp=Math.min(this.player.maxhp,this.player.hp+heal);
    this.log(`You drink a potion. +${heal} HP.`); this.endTurn();
  }
  eatFood(){
    if(this.player.food<=0){ this.log('No food.'); return; }
    this.player.food--;
    this.player.hunger=Math.max(0,this.player.hunger-30);
    this.player.hp=Math.min(this.player.maxhp,this.player.hp+4);
    this.log('You eat. Hunger -30, +4 HP.'); this.endTurn();
  }
  useScroll(){
    if(this.player.scrolls<=0){ this.log('No scrolls.'); return; }
    this.player.scrolls--;
    const eff=['reveal','fireball','teleport','heal'][Math.floor(Math.random()*4)];
    if(eff==='reveal'){ for(let y=0;y<MH;y++) for(let x=0;x<MW;x++) this.explored.add(x+','+y); this.log('The scroll reveals the floor.'); }
    else if(eff==='fireball'){ let cnt=0; for(const e of this.entities){ if(e.hp>0 && this.visible.has(e.x+','+e.y)){ e.hp-=12; cnt++; if(e.hp<=0){ e.hp=0; this.log(`${e.ch} dies.`); this.player.xp+=e.xp||3; this.checkLevel(); } } } this.log(`Fireball hits ${cnt} enemies.`); }
    else if(eff==='teleport'){ const tiles=[]; for(let y=0;y<MH;y++) for(let x=0;x<MW;x++) if([1,2,3].includes(this.grid[y][x]) && !this.entities.some(e=>e.hp>0&&e.x===x&&e.y===y)) tiles.push([x,y]); if(tiles.length){ const [x,y]=tiles[Math.floor(Math.random()*tiles.length)]; this.player.x=x; this.player.y=y; this.log('You teleport.'); } }
    else { this.player.hp=this.player.maxhp; this.log('Full heal.'); }
    this.endTurn();
  }
  useWand(invItem){
    let cnt=0;
    for(const e of this.entities){ if(e.hp>0 && this.visible.has(e.x+','+e.y)){ const d=Math.abs(e.x-this.player.x)+Math.abs(e.y-this.player.y); if(d<=5 && this.los(this.player.x,this.player.y,e.x,e.y)){ e.hp-=15; cnt++; if(e.hp<=0){ e.hp=0; this.log(`${e.ch} dies.`); this.player.xp+=e.xp||3; this.checkLevel(); } } } }
    this.log(`Wand hits ${cnt} enemies.`);
    this.player.inventory=this.player.inventory.filter(i=>i!==invItem);
    this.endTurn();
  }
  checkLevel(){
    let need=this.player.level*12;
    while(this.player.xp>=need){
      this.player.xp-=need; this.player.level++;
      this.player.maxhp+=6; this.player.hp=this.player.maxhp; this.player.atk++; this.player.def++;
      this.log(`Level up! You are level ${this.player.level}.`);
      need=this.player.level*12;
    }
  }
  search(){
    const {x:px,y:py}=this.player; let found=0;
    for(let dy=-2;dy<=2;dy++) for(let dx=-2;dx<=2;dx++){
      const x=px+dx,y=py+dy;
      if(x>=0&&x<MW&&y>=0&&y<MH && this.grid[y][x]===4){ this.grid[y][x]=2; found++; }
    }
    this.log(found?`You find ${found} secret door(s).`:'Nothing found.');
    this.endTurn();
  }
  openInv(){ this.invOpen=true; this.invCursor=0; renderInv(); }
  closeInv(){ this.invOpen=false; renderInv(); }
  invAction(key){
    const inv=this.player.inventory;
    if(key==='Escape'||key==='i'||key==='q'){ this.closeInv(); return; }
    if(key==='ArrowUp'||key==='k'){ this.invCursor=Math.max(0,this.invCursor-1); renderInv(); }
    else if(key==='ArrowDown'||key==='j'){ this.invCursor=Math.min(Math.max(0,inv.length-1),this.invCursor+1); renderInv(); }
    else if(key==='Enter'){
      if(!inv.length) return;
      const it=inv[this.invCursor];
      if(it.kind==='equip'){
        const item=it.item; const slot=item.type;
        if(slot==='weapon'){ if(this.player.weapon) this.player.inventory.push({ch:'/',name:this.player.weapon.name,item:this.player.weapon,kind:'equip'}); this.player.weapon=item; }
        else if(slot==='armor'){ if(this.player.armor) this.player.inventory.push({ch:']',name:this.player.armor.name,item:this.player.armor,kind:'equip'}); this.player.armor=item; }
        else if(slot==='ring'){ if(this.player.ring) this.player.inventory.push({ch:'=',name:this.player.ring.name,item:this.player.ring,kind:'equip'}); this.player.ring=item; }
        this.player.inventory.splice(this.invCursor,1);
        this.log(`Equipped ${item.name}.`);
      } else if(it.kind==='wand'){ this.useWand(it); this.closeInv(); }
      renderInv();
    } else if(key==='Delete'||key==='d'){
      if(inv.length && this.invCursor<inv.length){
        const it=inv.splice(this.invCursor,1)[0];
        this.log(`Dropped ${it.name}.`);
        if(this.invCursor>=inv.length) this.invCursor=Math.max(0,inv.length-1);
        renderInv();
      }
    }
  }
  charSheet(){ return `LVL ${this.player.level}  HP ${this.player.hp}/${this.player.maxhp}  ATK ${this.totalAtk()}  DEF ${this.totalDef()}  XP ${this.player.xp}/${this.player.level*12}  Gold ${this.player.gold}  Food ${this.player.food}  Hunger ${this.player.hunger}  Keys ${this.player.keys}`; }
  save(){ try{ localStorage.setItem('depths_save', JSON.stringify({floor:this.floor,player:this.player,explored:[...this.explored],messages:this.messages.slice(-5)})); this.log('Game saved.'); } catch(e){ this.log('Save failed.'); } }
  load(){ try{ const d=JSON.parse(localStorage.getItem('depths_save')); this.floor=d.floor; this.player=d.player; this.explored=new Set(d.explored); this.messages=d.messages||[]; this.newFloorLoad(); this.log('Game loaded.'); } catch(e){ this.log('No save found.'); } }
  newFloorLoad(){ const {grid,rooms}=makeDungeon(this.floor); this.grid=grid; const [rx,ry,rw,rh]=rooms[0]; this.player.x=Math.min(this.player.x,MW-1); this.player.y=Math.min(this.player.y,MH-1); const pe=placeEntities(grid,this.floor,this.player.x,this.player.y); this.entities=pe.entities; this.items=pe.items; this.traps=pe.traps; this.computeFov(); }
  handleKey(key){
    if(this.invOpen){ this.invAction(key); return; }
    if(key==='q'||key==='Escape') return 'quit';
    if(key==='ArrowUp'||key==='w'||key==='k') this.move(0,-1);
    else if(key==='ArrowDown'||key==='s'||key==='j') this.move(0,1);
    else if(key==='ArrowLeft'||key==='a'||key==='h') this.move(-1,0);
    else if(key==='ArrowRight'||key==='d'||key==='l') this.move(1,0);
    else if(key==='y') this.move(-1,-1);
    else if(key==='u') this.move(1,-1);
    else if(key==='b') this.move(-1,1);
    else if(key==='n') this.move(1,1);
    else if(key==='p'||key==='P') this.usePotion();
    else if(key==='f'||key==='F') this.eatFood();
    else if(key==='r'||key==='R') this.useScroll();
    else if(key==='i'||key==='I') this.openInv();
    else if(key==='c'||key==='C') this.log(this.charSheet());
    else if(key==='x'||key==='X') this.search();
    else if(key==='>') this.moveStairs();
    else if(key==='S') this.save();
    else if(key==='L') this.load();
  }
  moveStairs(){
    if(this.grid[this.player.y][this.player.x]===3){
      if(this.floor>=15){ this.victory=true; this.gameOver=true; this.log('You escaped the depths!'); return; }
      this.floor++; this.log(`You descend to floor ${this.floor}.`); this.newFloor();
    }
  }
}

function renderLog(){ const el=document.getElementById('log'); el.innerHTML=game.messages.map(m=>`<div>${escapeHtml(m)}</div>`).join(''); el.scrollTop=el.scrollHeight; }
function escapeHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
function renderStats(){
  if(!game) return;
  const p=game.player;
  document.getElementById('stats').innerHTML = `
    <span>Floor</span><b>${game.floor} ${biome(game.floor)}</b>
    <span>HP</span><b>${p.hp}/${p.maxhp}</b>
    <span>ATK</span><b>${game.totalAtk()}</b>
    <span>DEF</span><b>${game.totalDef()}</b>
    <span>Level</span><b>${p.level}</b>
    <span>XP</span><b>${p.xp}/${p.level*12}</b>
    <span>Gold</span><b>${p.gold}</b>
    <span>Food</span><b>${p.food}</b>
    <span>Hunger</span><b>${p.hunger}</b>
    <span>Potions</span><b>${p.potions}</b>
    <span>Scrolls</span><b>${p.scrolls}</b>
    <span>Keys</span><b>${p.keys}</b>`;
}
function renderInv(){
  if(!game) return;
  const inv=game.player.inventory;
  const el=document.getElementById('inv');
  if(!game.invOpen){ el.innerHTML='<div class="help">Press I to open</div>'; return; }
  el.innerHTML = inv.map((it,i)=>`<div class="item ${i===game.invCursor?'sel':''}" onclick="game.invCursor=${i};renderInv();">${it.name}</div>`).join('') || '<div class="help">(empty)</div>';
}

function draw(){
  if(!game) return;
  ctx.fillStyle = COLORS.floor;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // tiles
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const key=x+','+y;
    const explored=game.explored.has(key);
    if(!explored) continue;
    const visible=game.visible.has(key);
    const cell=game.grid[y][x];
    let col = COLORS.floor;
    if(cell===0) col=COLORS.wall;
    else if(cell===4) col=COLORS.secret;
    else if(cell===3) col=COLORS.stairs;
    else if(cell===2) col=COLORS.door;
    // floor variation
    if(cell===1 && ((x+y)%2===0)) col=COLORS.floorHi;
    if(cell===0 && ((x+y)%3===0)) col=COLORS.wallHi;
    ctx.fillStyle=col;
    ctx.fillRect(x*T, y*T, T, T);
    if(!visible){
      ctx.fillStyle=COLORS.explored;
      ctx.fillRect(x*T,y*T,T,T);
    }
    // stairs symbol
    if(cell===3 && visible){
      ctx.fillStyle=COLORS.stairs;
      ctx.font='bold 16px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('>', x*T+T/2, y*T+T/2);
    }
    if(cell===2 && visible){
      ctx.fillStyle=COLORS.door;
      ctx.font='bold 16px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText('+', x*T+T/2, y*T+T/2);
    }
  }
  // traps (only triggered or visible? show triggered)
  for(const t of game.traps){
    if(!game.visible.has(t.x+','+t.y)) continue;
    if(!t.triggered) continue;
    ctx.fillStyle=COLORS.trap;
    ctx.font='bold 14px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(t.ch, t.x*T+T/2, t.y*T+T/2);
  }
  // items
  for(const it of game.items){
    if(!game.visible.has(it.x+','+it.y)) continue;
    const colmap={'!':COLORS.potion,'%':COLORS.food,'/':COLORS.weapon,']':COLORS.armor,'$':COLORS.gold,'?':COLORS.scroll,'=':COLORS.ring,'w':COLORS.wand,'k':COLORS.key};
    const GLYPH={'/':')',']':']','w':'/'};
    ctx.fillStyle=colmap[it.ch]||'#fff';
    // small circle
    ctx.beginPath(); ctx.arc(it.x*T+T/2, it.y*T+T/2, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='#000'; ctx.font='bold 10px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(GLYPH[it.ch]||it.ch, it.x*T+T/2, it.y*T+T/2+1);
  }
  // mimics disguised as items
  for(const e of game.entities){
    if(e.hp<=0 || !e.disguise) continue;
    if(!game.visible.has(e.x+','+e.y)) continue;
    const colmap={'!':COLORS.potion,'%':COLORS.food,'/':COLORS.weapon,']':COLORS.armor,'$':COLORS.gold,'?':COLORS.scroll,'=':COLORS.ring,'w':COLORS.wand};
    ctx.fillStyle=colmap[e.disguise]||'#fff';
    ctx.beginPath(); ctx.arc(e.x*T+T/2, e.y*T+T/2, 5, 0, Math.PI*2); ctx.fill();
  }
  // enemies
  for(const e of game.entities){
    if(e.hp<=0 || e.disguise) continue;
    if(!game.visible.has(e.x+','+e.y)) continue;
    const col=COLORS[e.ch.toLowerCase()] || COLORS[e.ch] || '#ef4444';
    // map enemy char to color key
    const ckey = {g:'goblin',o:'orc',T:'troll',D:'dragon',s:'skeleton',b:'bat',W:'wraith',a:'archer',n:'necromancer',m:'mimic',r:'rat',V:'vampire',G:'golem'}[e.ch] || 'goblin';
    ctx.fillStyle=COLORS[ckey];
    // rounded square
    const pad=3;
    ctx.fillRect(e.x*T+pad, e.y*T+pad, T-pad*2, T-pad*2);
    // hp bar
    const pct=e.hp/e.maxhp;
    ctx.fillStyle='#000'; ctx.fillRect(e.x*T+pad, e.y*T+2, T-pad*2, 3);
    ctx.fillStyle='#22c55e'; ctx.fillRect(e.x*T+pad, e.y*T+2, (T-pad*2)*pct, 3);
    // letter
    ctx.fillStyle='#fff'; ctx.font='bold 14px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(e.ch, e.x*T+T/2, e.y*T+T/2+2);
  }
  // player
  const px=game.player.x*T, py=game.player.y*T;
  ctx.fillStyle=COLORS.player;
  ctx.fillRect(px+2, py+2, T-4, T-4);
  // eyes
  ctx.fillStyle=COLORS.playerEye;
  ctx.fillRect(px+7, py+8, 3, 3);
  ctx.fillRect(px+14, py+8, 3, 3);
  // hp bar for player
  const ppct=game.player.hp/game.player.maxhp;
  ctx.fillStyle='#000'; ctx.fillRect(px+2, py+1, T-4, 3);
  ctx.fillStyle='#22c55e'; ctx.fillRect(px+2, py+1, (T-4)*ppct, 3);
  // fog overlay for non-visible explored already done; ensure unexplored fully black
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    if(!game.explored.has(x+','+y)){
      ctx.fillStyle='#000'; ctx.fillRect(x*T,y*T,T,T);
    }
  }
}

function gameLoop(){
  if(game && !game.gameOver){ draw(); renderStats(); }
  requestAnimationFrame(gameLoop);
}

function restart(){ document.getElementById('overlay').style.display='none'; game=new Game(); renderLog(); renderInv(); }
function showOverlay(victory){
  const o=document.getElementById('overlay');
  o.style.display='flex';
  o.className = victory?'victory':'';
  document.getElementById('ovTitle').textContent = victory?'VICTORY!':'GAME OVER';
  document.getElementById('ovText').textContent = (victory?'You escaped the depths!':'You died in the depths.') + `  Floor ${game.floor}, Level ${game.player.level}, Gold ${game.player.gold}.`;
}

// input
window.addEventListener('keydown', e=>{
  if(!game) return;
  if(game.gameOver){ if(e.key==='r'||e.key==='R') restart(); return; }
  const key=e.key;
  game.handleKey(key);
  if(key==='i'||key==='I') renderInv();
  renderStats();
  if(game.gameOver) showOverlay(game.victory);
  e.preventDefault();
});

// boot
window.game=game=new Game();
renderLog(); renderInv(); renderStats();
requestAnimationFrame(gameLoop);
</script>
